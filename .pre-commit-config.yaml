default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: python -m mypy glpi_python_client
        language: system
        types: [python]
        pass_filenames: false

      # Fails on a _sync/ tree left stale by an edit to _async/. Runs at
      # commit time rather than pre-push so the generated tree is never
      # committed out of step with its source.
      - id: unasync-check
        name: generated sync tree is up to date
        entry: python unasync_build.py --check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: pytest with coverage (>=95%)
        entry: python -m pytest -m "not integration" --cov=glpi_python_client --cov-fail-under=95 -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: sphinx-build
        name: sphinx build (warnings as errors)
        entry: python -m sphinx -b html -W --keep-going docs docs/_build/html_check
        language: system
        pass_filenames: false
        stages: [pre-push]
